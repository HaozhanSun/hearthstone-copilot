[project]
name = "hscopilot"
version = "0.1.0"
description = "Read-only Hearthstone Power.log copilot and replay evaluator"
requires-python = ">=3.12"
dependencies = ["hslog>=3.0", "hearthstone>=6.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
hscopilot = "hscopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
